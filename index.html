<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Cartes de Mots</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #F7F3EE; --warm: #EDE5D8; --sand: #D4C5B0;
    --clay: #9B7E6A; --dark: #2C2420; --accent: #7A6652;
    --green: #5C7A62; --rust: #B5654A; --shadow: rgba(44,36,32,0.08);
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream); color: var(--dark);
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; padding: 20px 16px 60px;
  }
  header { text-align: center; margin-bottom: 24px; width: 100%; }
  .app-title { font-family: 'Cormorant Garamond', serif; font-size: 1.9rem; font-weight: 300; letter-spacing: 0.05em; }
  .app-subtitle { font-size: 0.7rem; color: var(--clay); letter-spacing: 0.14em; text-transform: uppercase; margin-top: 4px; font-weight: 500; }
  .progress-bar { width: 100%; max-width: 380px; height: 2px; background: var(--sand); border-radius: 2px; margin: 14px auto 0; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--clay); border-radius: 2px; transition: width 0.4s ease; }
  .card-counter { font-size: 0.68rem; color: var(--clay); text-align: center; margin-top: 7px; letter-spacing: 0.08em; }

  .deck-tabs { display: flex; gap: 8px; width: 100%; max-width: 380px; margin-bottom: 18px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
  .deck-tabs::-webkit-scrollbar { display: none; }
  .deck-tab { flex-shrink: 0; padding: 7px 14px; border-radius: 20px; border: 1px solid var(--sand); background: none; font-family: 'DM Sans', sans-serif; font-size: 0.74rem; color: var(--clay); cursor: pointer; letter-spacing: 0.04em; transition: all 0.2s; white-space: nowrap; }
  .deck-tab.active { background: var(--dark); color: var(--cream); border-color: var(--dark); }
  .deck-tab .count { opacity: 0.55; font-size: 0.7rem; margin-left: 4px; }

  .mode-toggle { display: flex; gap: 4px; width: 100%; max-width: 380px; margin-bottom: 18px; background: var(--warm); border-radius: 10px; padding: 3px; }
  .mode-btn { flex: 1; padding: 8px; border: none; background: none; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 0.74rem; color: var(--clay); cursor: pointer; letter-spacing: 0.05em; transition: all 0.2s; }
  .mode-btn.active { background: white; color: var(--dark); box-shadow: 0 1px 3px var(--shadow); }

  .card-scene { width: 100%; max-width: 380px; height: 280px; perspective: 1000px; cursor: pointer; margin-bottom: 22px; }
  .card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.5s cubic-bezier(0.4,0,0.2,1); }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 28px 24px; }
  .card-front { background: white; border: 1px solid var(--warm); box-shadow: 0 4px 24px var(--shadow); }
  .card-back { background: var(--dark); transform: rotateY(180deg); box-shadow: 0 4px 24px rgba(44,36,32,0.15); }
  .card-label { font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase; font-weight: 500; margin-bottom: 12px; color: var(--sand); }
  .card-word { font-family: 'Cormorant Garamond', serif; font-size: 1.95rem; font-weight: 300; text-align: center; line-height: 1.2; color: var(--dark); padding: 0 8px; }
  .card-back .card-word { color: var(--cream); font-size: 1.65rem; }
  .card-example { font-family: 'Cormorant Garamond', serif; font-size: 0.95rem; color: var(--sand); text-align: center; margin-top: 10px; font-style: italic; line-height: 1.5; padding: 0 8px; }
  .grammar-tag { display: inline-block; font-size: 0.65rem; letter-spacing: 0.08em; color: var(--rust); background: rgba(181,101,74,0.08); padding: 3px 10px; border-radius: 10px; margin-top: 10px; font-style: normal; font-family: 'DM Sans', sans-serif; font-weight: 500; }
  .card-back .grammar-tag { color: var(--sand); background: rgba(212,197,176,0.12); }
  .tense-tag { display: inline-block; font-size: 0.62rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); background: rgba(122,102,82,0.08); padding: 3px 10px; border-radius: 10px; margin-top: 6px; font-family: 'DM Sans', sans-serif; font-weight: 500; }
  .card-back .tense-tag { color: var(--sand); background: rgba(212,197,176,0.12); }
  .tap-hint { font-size: 0.6rem; color: var(--sand); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 16px; opacity: 0.55; }

  .audio-btn { position: absolute; top: 14px; right: 14px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--warm); background: white; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .card-back .audio-btn { background: rgba(247,243,238,0.1); border-color: rgba(212,197,176,0.3); }
  .audio-btn:hover { transform: scale(1.05); }
  .audio-btn:active { transform: scale(0.92); }
  .audio-btn svg { width: 14px; height: 14px; fill: var(--clay); }
  .card-back .audio-btn svg { fill: var(--sand); }

  .response-buttons { display: flex; gap: 10px; width: 100%; max-width: 380px; margin-bottom: 24px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
  .response-buttons.visible { opacity: 1; pointer-events: all; }
  .btn { flex: 1; padding: 13px 8px; border: none; border-radius: 11px; font-family: 'DM Sans', sans-serif; font-size: 0.78rem; font-weight: 500; letter-spacing: 0.04em; cursor: pointer; transition: transform 0.15s ease; }
  .btn:active { transform: scale(0.96); }
  .btn-again { background: #F0E8E4; color: #8B5E52; }
  .btn-hard { background: #EDE8DD; color: var(--accent); }
  .btn-good { background: var(--green); color: white; }

  .browse-list { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
  .browse-card { background: white; border: 1px solid var(--warm); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 1px 3px var(--shadow); transition: all 0.2s; position: relative; }
  .browse-fr { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; font-weight: 400; line-height: 1.3; padding-right: 110px; }
  .browse-en { font-size: 0.78rem; color: var(--clay); padding-right: 110px; }
  .browse-ex { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 0.85rem; color: var(--accent); margin-top: 4px; padding-right: 110px; }
  .browse-actions { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); display: flex; gap: 4px; }
  .icon-btn { width: 30px; height: 30px; border: none; background: var(--warm); border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
  .icon-btn:hover { background: var(--sand); }
  .icon-btn:active { transform: scale(0.9); }
  .icon-btn svg { width: 13px; height: 13px; fill: var(--clay); }

  .add-section { width: 100%; max-width: 380px; }
  .add-toggle { display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--dark); border: none; border-radius: 12px; padding: 14px 16px; width: 100%; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; color: var(--cream); letter-spacing: 0.05em; font-weight: 500; transition: opacity 0.2s; margin-bottom: 12px; }
  .add-toggle:hover { opacity: 0.9; }
  .add-form { display: none; flex-direction: column; gap: 10px; background: white; border: 1px solid var(--warm); border-radius: 14px; padding: 18px; box-shadow: 0 4px 16px var(--shadow); }
  .add-form.open { display: flex; }
  .form-title { font-family: 'Cormorant Garamond', serif; font-size: 1.25rem; font-weight: 400; margin-bottom: 4px; }
  .add-form input, .add-form select {
    border: 1px solid var(--warm); border-radius: 8px; padding: 11px 14px;
    font-family: 'DM Sans', sans-serif; font-size: 0.9rem; color: var(--dark);
    background: var(--cream); outline: none; transition: border-color 0.2s; width: 100%;
  }
  .add-form input:focus, .add-form select:focus { border-color: var(--clay); }
  .add-form input::placeholder { color: var(--sand); }
  .form-row { display: flex; gap: 8px; }
  .form-row > * { flex: 1; }
  .btn-add { background: var(--dark); color: var(--cream); border: none; border-radius: 8px; padding: 12px; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 500; cursor: pointer; letter-spacing: 0.05em; flex: 2; }
  .btn-cancel { background: none; border: 1px solid var(--sand); color: var(--clay); border-radius: 8px; padding: 12px; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; cursor: pointer; flex: 1; }
  .form-actions { display: flex; gap: 8px; }

  .done-state { text-align: center; padding: 40px 20px; width: 100%; max-width: 380px; }
  .done-icon { font-size: 2.4rem; margin-bottom: 14px; }
  .done-state h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.55rem; font-weight: 300; margin-bottom: 8px; }
  .done-state p { font-size: 0.8rem; color: var(--clay); margin-bottom: 20px; line-height: 1.5; }
  .btn-restart { background: var(--dark); color: var(--cream); border: none; border-radius: 10px; padding: 12px 28px; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; cursor: pointer; letter-spacing: 0.05em; }
</style>
</head>
<body>
<header>
  <div class="app-title">Cartes de Mots</div>
  <div class="app-subtitle">French Flashcards</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="card-counter" id="cardCounter"></div>
</header>

<div class="deck-tabs" id="deckTabs"></div>

<div class="mode-toggle">
  <button class="mode-btn active" id="modeStudy" onclick="setMode('study')">Study</button>
  <button class="mode-btn" id="modeBrowse" onclick="setMode('browse')">Browse</button>
</div>

<div id="mainContent"></div>

<div class="add-section">
  <button class="add-toggle" onclick="openAddForm()">＋ Add new card</button>
  <div class="add-form" id="addForm">
    <div class="form-title" id="formTitle">New card</div>
    <input type="text" id="inputFrench" placeholder="French word or phrase" />
    <input type="text" id="inputEnglish" placeholder="English meaning" />
    <input type="text" id="inputExample" placeholder="Example sentence (optional)" />
    <div class="form-row">
      <input type="text" id="inputGrammar" placeholder="Tag e.g. + subj., je plie" />
      <select id="inputCategory"></select>
    </div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="closeAddForm()">Cancel</button>
      <button class="btn-add" id="saveBtn" onclick="saveCard()">Add card</button>
    </div>
  </div>
</div>

function loadDecks() {
  try {
    const saved = localStorage.getItem('cartesDeMots_decks');
    if (saved) {
      const parsed = JSON.parse(saved);
      const merged = JSON.parse(JSON.stringify(DEFAULT_DECKS));
      Object.keys(parsed).forEach(key => {
        if (key === '_edits') return;
        if (key === 'mine') {
          if (parsed[key].cards) merged[key].cards = parsed[key].cards;
        } else if (merged[key] && parsed[key].cards) {
          const userCards = parsed[key].cards.filter(c => c.userAdded);
          merged[key].cards.push(...userCards);
        }
      });
      if (parsed._edits) {
        Object.keys(parsed._edits).forEach(deckKey => {
          if (!merged[deckKey]) return;
          parsed._edits[deckKey].forEach(edit => {
            if (edit.deleted) {
              merged[deckKey].cards = merged[deckKey].cards.filter(c => c.fr !== edit.original_fr);
            } else if (edit.original_fr && edit.changes) {
              const idx = merged[deckKey].cards.findIndex(c => c.fr === edit.original_fr);
              if (idx !== -1) merged[deckKey].cards[idx] = { ...merged[deckKey].cards[idx], ...edit.changes, _origFr: edit.original_fr };
            }
          });
        });
      }
      return merged;
    }
  } catch (e) { console.warn('Could not load saved decks', e); }
  return JSON.parse(JSON.stringify(DEFAULT_DECKS));
}

function saveDecks() {
  try {
    const toSave = { _edits: {} };
    Object.keys(decks).forEach(key => {
      if (key === 'mine') {
        toSave[key] = { cards: decks[key].cards };
      } else {
        const userAdded = decks[key].cards.filter(c => c.userAdded);
        if (userAdded.length) toSave[key] = { cards: userAdded };
        const defaultCards = DEFAULT_DECKS[key].cards;
        const currentDefault = decks[key].cards.filter(c => !c.userAdded);
        const edits = [];
        defaultCards.forEach(orig => {
          const found = currentDefault.find(c => c.fr === orig.fr || c._origFr === orig.fr);
          if (!found) {
            edits.push({ original_fr: orig.fr, deleted: true });
          } else if (found._origFr === orig.fr) {
            edits.push({ original_fr: orig.fr, changes: { fr: found.fr, en: found.en, ex: found.ex, grammar: found.grammar } });
          }
        });
        if (edits.length) toSave._edits[key] = edits;
      }
    });
    localStorage.setItem('cartesDeMots_decks', JSON.stringify(toSave));
  } catch (e) { console.warn('Could not save decks', e); }
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

let frenchVoice = null;
function loadVoices() {
  if (typeof speechSynthesis === 'undefined') return;
  const voices = speechSynthesis.getVoices();
  frenchVoice = voices.find(v => v.lang === 'fr-FR') || voices.find(v => v.lang.startsWith('fr')) || null;
}
if (typeof speechSynthesis !== 'undefined') {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}
function speak(text, event) {
  if (event) event.stopPropagation();
  if (typeof speechSynthesis === 'undefined') return;
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'fr-FR';
  if (frenchVoice) utterance.voice = frenchVoice;
  utterance.rate = 0.9;
  speechSynthesis.speak(utterance);
}

function setMode(newMode) {
  mode = newMode;
  document.getElementById('modeStudy').classList.toggle('active', mode === 'study');
  document.getElementById('modeBrowse').classList.toggle('active', mode === 'browse');
  if (mode === 'study') initDeck();
  else render();
}

function switchDeck(key) {
  currentDeck = key;
  if (mode === 'study') initDeck();
  else render();
}

function initDeck() {
  queue = shuffle(decks[currentDeck].cards);
  currentIndex = 0;
  isFlipped = false;
  render();
}

function render() {
  renderTabs();
  if (mode === 'browse') { renderBrowse(); return; }
  if (!queue.length) { renderEmpty(); return; }
  if (currentIndex >= queue.length) { renderDone(); return; }
  renderCard();
}

function renderTabs() {
  document.getElementById('deckTabs').innerHTML = Object.entries(decks).map(([key,deck]) =>
    `<button class="deck-tab ${key===currentDeck?'active':''}" onclick="switchDeck('${key}')">${deck.label}<span class="count">${deck.cards.length}</span></button>`
  ).join('');
}

const audioIcon = `<svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`;
const editIcon = `<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>`;
const trashIcon = `<svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>`;

function isConjugationDeck() {
  return currentDeck === 'conjugaisons' || currentDeck === 'completer';
}

function renderCard() {
  const card = queue[currentIndex];
  document.getElementById('progressFill').style.width = (currentIndex/queue.length*100) + '%';
  document.getElementById('cardCounter').textContent = `${currentIndex+1} / ${queue.length}`;
  // For conjugation/completion decks, the "answer" is on the back; speak the back text
  const conjugation = isConjugationDeck();
  const speakText = conjugation ? (card.ex || card.en) : card.fr;
  const frEsc = JSON.stringify(speakText).replace(/"/g,'&quot;');
  const frontLabel = conjugation ? 'Prompt' : 'Français';
  const backLabel = conjugation ? 'Réponse' : 'English';

  document.getElementById('mainContent').innerHTML = `
    <div class="card-scene" onclick="flipCard()">
      <div class="card-inner ${isFlipped?'flipped':''}" id="cardInner">
        <div class="card-face card-front">
          ${!conjugation ? `<button class="audio-btn" onclick="speak(${frEsc}, event)" aria-label="Play">${audioIcon}</button>` : ''}
          <div class="card-label">${frontLabel}</div>
          <div class="card-word">${escapeHtml(card.fr)}</div>
          ${card.grammar ? `<div class="${conjugation ? 'tense-tag' : 'grammar-tag'}">${escapeHtml(card.grammar)}</div>` : ''}
          <div class="tap-hint">tap to reveal</div>
        </div>
        <div class="card-face card-back">
          <button class="audio-btn" onclick="speak(${frEsc}, event)" aria-label="Play">${audioIcon}</button>
          <div class="card-label">${backLabel}</div>
          <div class="card-word">${escapeHtml(card.en)}</div>
          ${card.ex ? `<div class="card-example">${escapeHtml(card.ex)}</div>` : ''}
          ${card.grammar ? `<div class="${conjugation ? 'tense-tag' : 'grammar-tag'}">${escapeHtml(card.grammar)}</div>` : ''}
        </div>
      </div>
    </div>
    <div class="response-buttons ${isFlipped?'visible':''}" id="responseButtons">
      <button class="btn btn-again" onclick="respond('again')">Again</button>
      <button class="btn btn-hard" onclick="respond('hard')">Hard</button>
      <button class="btn btn-good" onclick="respond('good')">Got it ✓</button>
    </div>`;
}

function renderBrowse() {
  document.getElementById('progressFill').style.width = '0%';
  const cards = decks[currentDeck].cards;
  document.getElementById('cardCounter').textContent = `${cards.length} cards`;
  if (!cards.length) { renderEmpty(); return; }
  const conjugation = isConjugationDeck();
  document.getElementById('mainContent').innerHTML = `
    <div class="browse-list">
      ${cards.map((card, idx) => {
        const speakText = conjugation ? (card.ex || card.en) : card.fr;
        const frEsc = JSON.stringify(speakText).replace(/"/g,'&quot;');
        return `
        <div class="browse-card">
          <div class="browse-fr">${escapeHtml(card.fr)}${card.grammar ? ` <span class="${conjugation ? 'tense-tag' : 'grammar-tag'}">${escapeHtml(card.grammar)}</span>` : ''}</div>
          <div class="browse-en">${escapeHtml(card.en)}</div>
          ${card.ex ? `<div class="browse-ex">${escapeHtml(card.ex)}</div>` : ''}
          <div class="browse-actions">
            <button class="icon-btn" onclick="speak(${frEsc}, event)" aria-label="Play">${audioIcon}</button>
            <button class="icon-btn" onclick="editCard('${currentDeck}', ${idx})" aria-label="Edit">${editIcon}</button>
            <button class="icon-btn" onclick="deleteCard('${currentDeck}', ${idx})" aria-label="Delete">${trashIcon}</button>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

function renderDone() {
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('cardCounter').textContent = `${queue.length} / ${queue.length}`;
  document.getElementById('mainContent').innerHTML = `
    <div class="done-state">
      <div class="done-icon">🌿</div>
      <h3>Bien joué !</h3>
      <p>You went through all ${queue.length} cards.</p>
      <button class="btn-restart" onclick="initDeck()">Practice again</button>
    </div>`;
}

function renderEmpty() {
  document.getElementById('mainContent').innerHTML = `
    <div class="done-state">
      <div class="done-icon">✦</div>
      <h3>No cards yet</h3>
      <p>Add your first card below.</p>
    </div>`;
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('cardCounter').textContent = '';
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}

function flipCard() {
  isFlipped = !isFlipped;
  const inner = document.getElementById('cardInner');
  if (inner) inner.classList.toggle('flipped', isFlipped);
  const btns = document.getElementById('responseButtons');
  if (btns) btns.classList.toggle('visible', isFlipped);
}

function respond(rating) {
  if (rating === 'again') {
    const card = queue[currentIndex];
    queue.splice(currentIndex, 1);
    queue.splice(Math.min(currentIndex+3, queue.length), 0, card);
  } else { currentIndex++; }
  isFlipped = false;
  renderCard();
}

function populateCategorySelect() {
  const sel = document.getElementById('inputCategory');
  sel.innerHTML = Object.entries(decks).map(([key, deck]) =>
    `<option value="${key}">${deck.label}</option>`
  ).join('');
}

function openAddForm() {
  editingCardId = null;
  document.getElementById('formTitle').textContent = 'New card';
  document.getElementById('saveBtn').textContent = 'Add card';
  populateCategorySelect();
  document.getElementById('inputCategory').value = currentDeck;
  ['inputFrench','inputEnglish','inputExample','inputGrammar'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('addForm').classList.add('open');
  document.getElementById('inputFrench').focus();
}

function closeAddForm() {
  document.getElementById('addForm').classList.remove('open');
  editingCardId = null;
}

function editCard(deckKey, idx) {
  editingCardId = { deckKey, idx };
  const card = decks[deckKey].cards[idx];
  document.getElementById('formTitle').textContent = 'Edit card';
  document.getElementById('saveBtn').textContent = 'Save changes';
  populateCategorySelect();
  document.getElementById('inputCategory').value = deckKey;
  document.getElementById('inputFrench').value = card.fr;
  document.getElementById('inputEnglish').value = card.en;
  document.getElementById('inputExample').value = card.ex || '';
  document.getElementById('inputGrammar').value = card.grammar || '';
  document.getElementById('addForm').classList.add('open');
  document.getElementById('addForm').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function deleteCard(deckKey, idx) {
  const card = decks[deckKey].cards[idx];
  if (!confirm(`Delete "${card.fr}"?`)) return;
  decks[deckKey].cards.splice(idx, 1);
  saveDecks();
  if (mode === 'study') initDeck(); else render();
}

function saveCard() {
  const fr = document.getElementById('inputFrench').value.trim();
  const en = document.getElementById('inputEnglish').value.trim();
  const ex = document.getElementById('inputExample').value.trim();
  const grammar = document.getElementById('inputGrammar').value.trim();
  const targetDeck = document.getElementById('inputCategory').value;
  if (!fr || !en) { alert('French and English are required'); return; }

  if (editingCardId) {
    const { deckKey, idx } = editingCardId;
    const original = decks[deckKey].cards[idx];
    const origFr = original._origFr || original.fr;
    if (deckKey === targetDeck) {
      decks[deckKey].cards[idx] = {
        ...original,
        fr, en, ex, grammar,
        _origFr: original.userAdded ? undefined : origFr
      };
    } else {
      decks[deckKey].cards.splice(idx, 1);
      decks[targetDeck].cards.push({ fr, en, ex, grammar, userAdded: true });
    }
  } else {
    decks[targetDeck].cards.push({ fr, en, ex, grammar, userAdded: true });
  }

  saveDecks();
  closeAddForm();
  currentDeck = targetDeck;
  if (mode === 'study') initDeck(); else render();
}

populateCategorySelect();
initDeck();
</script>
</body>
</html>
